<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We'll Be Back Soon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at top,#292319,#090909 65%);
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
overflow:hidden;
}
.container{padding:30px;max-width:600px;animation:fade 1.5s ease}
.logo{
font-size:55px;
margin-bottom:25px;
animation:float 3s ease-in-out infinite;
}
.line{
width:65px;height:3px;
background:#c9a45c;
margin:25px auto;
}
h1{
font-size:clamp(34px,8vw,55px);
color:#d7b777;
letter-spacing:2px;
margin-bottom:18px;
}
p{
font-size:16px;
line-height:1.9;
color:#c7c2b9;
}
.status{
display:inline-block;
margin-top:30px;
padding:12px 25px;
border:1px solid #c9a45c;
border-radius:30px;
color:#d7b777;
font-size:12px;
letter-spacing:3px;
}
.footer{
margin-top:55px;
font-size:11px;
color:#777;
letter-spacing:2px;
}
@keyframes fade{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:translateY(0)}
}
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-12px)}
}
</style>
</head>
<body>
<div class="container">
<div class="logo">☕</div>

<h1>We'll Be Back Soon</h1>

<div class="line"></div>

<p>
We're preparing something special for you.<br>
Our restaurant menu is temporarily unavailable.<br>
Please visit us again soon!
</p>

<div class="status">TEMPORARILY CLOSED</div>

<div class="footer">
THANK YOU FOR YOUR PATIENCE
</div>
</div>
</body>
</html>
